[package]
name = "pentest-collaborator"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "signal", "time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "signal", "time"] }
