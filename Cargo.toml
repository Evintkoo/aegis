[workspace]
resolver = "2"
members = ["crates/core", "crates/dast"]

[package]
name = "pentest"
version = "0.1.0"
edition = "2021"

[dependencies]
pentest-core = { path = "crates/core" }
pentest-dast = { path = "crates/dast" }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
serde_json = "1.0"
