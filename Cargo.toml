[workspace]
resolver = "2"
members = ["crates/core", "crates/dast", "crates/collaborator", "crates/cve-lookup", "crates/sast"]

[package]
name = "pentest"
version = "0.1.0"
edition = "2021"

[dependencies]
pentest-core = { path = "crates/core" }
pentest-cve-lookup = { path = "crates/cve-lookup" }
pentest-dast = { path = "crates/dast" }
clap = { version = "4.6", features = ["derive"] }
reqwest = "0.13"
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
